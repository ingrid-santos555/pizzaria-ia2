<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='formulario.css') }}"> 
    <title>Cadastro de Funcionário</title>
</head>
<body>
<header class="navbar">
    <div>
        <a href="{{ url_for('index') }}">Página Inicial</a>
        <a href="{{ url_for('logout') }}">Sair</a>
    </div>
</header>

<div class="container">
    <div class="title">Registro de Funcionário</div>

    <form id="formCadastro">

        <div class="user-details">

            <div class="input-box">
                <span class="details">Nome Completo</span>
                <input type="text" name="nome" placeholder="Registre nome" required>
            </div>

            <div class="input-box">
                <span class="details">ID Usuário</span>
                <input type="text" name="username" placeholder="Usuário para login" required>
            </div>

            <div class="input-box">
                <span class="details">Telefone</span>
                <input type="text" name="telefone" placeholder="Ex: 19999999999" required>
            </div>

            <div class="input-box">
                <span class="details">Senha</span>
                <input type="password" name="senha" placeholder="Digite a senha" required>
            </div>

            <div class="input-box">
                <span class="details">Confirmar Senha</span>
                <input type="password" name="confirmar" placeholder="Confirme a senha" required>
            </div>

        </div>

        <div class="button">
            <input type="submit" value="Registrar">
        </div>

    </form>
</div>

<script src="{{ url_for('static', filename='script_formulario.js') }}"></script>

</body>
</html>
