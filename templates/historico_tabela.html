<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='historico_tabela.css') }}">
</head>
<body>

  <!-- ✅ NAVBAR CORRETA -->
<header class="navbar">
    <div>
        <a href="{{ url_for('index') }}">Página Inicial</a>
        <a href="{{ url_for('logout') }}">Sair</a>
    </div>
</header>

  <div class="container">
    <h1>Histórico de Pedidos</h1>

    <div class="download">
      <span>⬤ Baixar Histórico CSV</span>
      <div class="dropdown">
        <button>▼</button>
        <div class="dropdown-content">
          <div onclick="baixarCSV('semana')">1 Semana</div>
          <div onclick="baixarCSV('mes')">1 Mês</div>
          <div onclick="baixarCSV('ano')">1 Ano</div>
        </div>
      </div>
    </div>

    <table id="tabela">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Endereço</th>
          <th>Itens</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Data</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="{{ url_for('static', filename='script_tabela.js') }}"></script>
</body>
</html>
